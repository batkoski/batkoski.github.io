<!-- Custom Styles -->
<style>
/* Import Nunito Sans font */
@import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;700&display=swap');

/* Apply Nunito Sans to page title */
.navbar-brand {
  font-family: 'Nunito Sans', sans-serif !important;
  font-weight: 700 !important;
  text-transform: uppercase !important;
}

/* Apply Nunito Sans Regular to body text */
body {
  font-family: 'Nunito Sans', sans-serif !important;
  font-weight: 400 !important;
}

/* Apply to all text elements */
p, div, span, li, a, h1, h2, h3, h4, h5, h6 {
  font-family: 'Nunito Sans', sans-serif !important;
}

/* Keep main headings at bold weight */
h1, h2, h3 {
  font-weight: 700 !important;
}

/* Medium weight for smaller headings */
h4, h5, h6, .subheading {
  font-weight: 500 !important;
}

/* Regular weight for body text */
p, div, span, li {
  font-weight: 400 !important;
}

/* Hide timeline line after last item */
.timeline > li:last-child::after {
  display: none !important;
}

.timeline > li:last-child::before {
  display: none !important;
}

/* Make project modals smaller and not full screen */
.portfolio-modal .modal-dialog {
  max-width: 800px !important;
  margin: 50px auto !important;
}

.portfolio-modal .modal-content {
  padding: 50px !important;
}

/* Make project images much smaller */
.portfolio-modal .modal-body img {
  width: 20% !important;
  max-width: 200px !important;
  height: auto !important;
  margin: 0 auto 30px !important;
  display: block !important;
}
</style>
