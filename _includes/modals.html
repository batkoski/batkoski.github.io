<!-- Portfolio Modals -->
{% for project in site.portfolio %}
<div class="portfolio-modal modal fade" id="p{{ forloop.index }}" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="close-modal" data-dismiss="modal">
        <div class="lr">
          <div class="rl"></div>
        </div>
      </div>
      <div class="container">
        <div class="row">
          <div class="col-lg-12">
            <div class="modal-body">
              <h2 class="text-uppercase">{{ project.title }}</h2>
              
              {{ project.content }}
              
              {% if project.slideshow %}
              <!-- Visuals section -->
              <h4>Visuals</h4>
              <div id="carousel{{ forloop.index }}" class="carousel slide mt-3" data-interval="false">
                <!-- Slides -->
                <div class="carousel-inner">
                  {% for slide in project.slideshow %}
                  <div class="carousel-item {% if forloop.first %}active{% endif %}">
                    <img class="d-block w-100" src="{{ slide.image }}" alt="{{ slide.caption }}" style="max-height: 400px; object-fit: contain;">
                    <div class="carousel-caption d-block position-static text-center" style="background: none; color: #6c757d; padding: 5px 0 0 0;">
                      <p style="font-style: italic; margin: 0;">{{ slide.caption }}</p>
                    </div>
                  </div>
                  {% endfor %}
                </div>
                
                {% if project.slideshow.size > 1 %}
                <!-- Navigation -->
                <a class="carousel-control-prev" href="#carousel{{ forloop.index }}" role="button" data-slide="prev" style="width: 5%; color: #6c757d;">
                  <span style="font-size: 1rem;"><i class="fas fa-chevron-left"></i> Previous</span>
                </a>
                <a class="carousel-control-next" href="#carousel{{ forloop.index }}" role="button" data-slide="next" style="width: 5%; color: #6c757d;">
                  <span style="font-size: 1rem;">Next <i class="fas fa-chevron-right"></i></span>
                </a>
                {% endif %}
              </div>
              {% endif %}
              
              <div class="text-center mt-5">
                <button class="btn btn-primary" data-dismiss="modal" type="button">
                  {{ site.data.sitetext[site.locale].portfolio.closebutton }}
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endfor %}
