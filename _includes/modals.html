<!-- Portfolio Modals -->
{% for project in site.portfolio %}
<div class="portfolio-modal modal fade" id="p{{ forloop.index }}" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="close-modal" data-dismiss="modal">
        <div class="lr">
          <div class="rl"></div>
        </div>
      </div>
      <div class="container">
        <div class="row">
          <div class="col-lg-12">
            <div class="modal-body">
              <h2 class="text-uppercase">{{ project.title }}</h2>
              <p class="item-intro text-muted">{{ project.subtitle }}</p>
              
              {% if project.slideshow %}
              <!-- Image Slideshow -->
              <div id="carousel{{ forloop.index }}" class="carousel slide mb-4" data-ride="carousel">
                <div class="carousel-inner">
                  {% for slide in project.slideshow %}
                  <div class="carousel-item {% if forloop.first %}active{% endif %}">
                    <img class="d-block w-100" src="{{ slide.image }}" alt="{{ slide.caption }}" style="max-height: 300px; object-fit: contain;">
                    <div class="carousel-caption d-none d-md-block">
                      <p class="bg-dark text-white p-2 rounded">{{ slide.caption }}</p>
                    </div>
                  </div>
                  {% endfor %}
                </div>
                {% if project.slideshow.size > 1 %}
                <a class="carousel-control-prev" href="#carousel{{ forloop.index }}" role="button" data-slide="prev">
                  <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                  <span class="sr-only">Previous</span>
                </a>
                <a class="carousel-control-next" href="#carousel{{ forloop.index }}" role="button" data-slide="next">
                  <span class="carousel-control-next-icon" aria-hidden="true"></span>
                  <span class="sr-only">Next</span>
                </a>
                {% endif %}
              </div>
              {% endif %}
              
              {{ project.content }}
              <button class="btn btn-primary" data-dismiss="modal" type="button">
                {{ site.data.sitetext[site.locale].portfolio.closebutton }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endfor %}
