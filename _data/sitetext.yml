en: &DEFAULT_EN
  header:
    title: Hi, I'm Elijah.
    first_sentence: "I'm a Senior UX Writer and Technical Writer with 7+ years crafting intuitive experiences and comprehensive documentation for complex platforms at AWS and Microsoft."
    text: | 
      I specialize in establishing brand voice and tone, developing scalable content systems, and leveraging AI/ML tools to solve real problems—from creating an AI-powered copy assistant to organizing 1,500+ customer tickets. I collaborate deeply with engineering, product, and design teams to influence product direction, whether I'm designing UI copy, architecting documentation for complex services, or creating API references. From participating in 50+ product reviews to leading documentation teams of 6+, I'm driven by making complex technology accessible and delightful for users worldwide.

      Beyond my professional work, I'm an avid gamer with a deep love for video games and trading card games—hobbies that fuel my understanding of how language shapes player experiences and builds community. I enjoy being a father of two boys, where I'm constantly learning about curiosity, creativity, and seeing the world through fresh eyes. When I'm not at my desk, you'll find me lifting weights, experimenting in the kitchen, or spending time with my family.
    image: assets/img/elijah_headshot.png
    social:
      - url: https://linkedin.com/in/elijah-batkoski-54255559
        icon: fab fa-linkedin-in
      - url: mailto:ebatkoski@gmail.com
        icon: fas fa-envelope

  services:
    title: "Skills"
    text: "What I bring to the table"
    section: services
    list:
      - title: "Leverage AI/ML tools & automation"
        desc: "Design and deploy AI-powered solutions that transform manual workflows into automated, scalable systems delivering immediate business value."
        icon: fas fa-robot
      - title: "Champion customer empathy"
        desc: "Transform customer feedback and data into strategic insights that drive product decisions and enhance user experiences."
        icon: fas fa-heart
      - title: "Bridge technical & creative disciplines"
        desc: "Collaborate across design, engineering, and product teams to deliver solutions that balance technical feasibility with exceptional user experience."
        icon: fas fa-handshake

  portfolio:
    title: "Projects"
    text: "Check out some of my recent work"
    section: portfolio
    closebutton: "Close"

  timeline:
    title: "Experience"
    text: "My professional journey"
    section: timeline
    start_align: "left"
    events:
      - title: "Senior UX Writer"
        company: "Amazon Web Services"
        year: "July 2025 - Present"
        desc: "Created comprehensive copy guidance for Quick Suite product launch, participated in 50+ Fit and Finish reviews, and designed 'UX Copy Writing Assistant' custom AI agent enabling teams to generate publish-ready copy in seconds."
        image: assets/img/timeline/1.jpg
        icon: fas fa-pen-fancy
        alt:
        align: left
      - title: "Senior Technical Writer"
        company: "Amazon Web Services"
        year: "July 2023 - July 2025"
        desc: "Led team of 6 writers creating documentation for Quick Suite, leveraged Bedrock to organize 1,500+ QuickSight customer tickets, and orchestrated documentation for 10+ CodeCatalyst feature launches at AWS re:Invent."
        image: assets/img/timeline/2.jpg
        icon: fas fa-file-alt
        alt:
        align: left
      - title: "Senior Documentation Manager"
        company: "Amazon Web Services"
        year: "May 2022 - July 2023"
        desc: "Managed team of 6 technical writers supporting CodeCatalyst documentation, led agile development processes, and drove documentation strategy for CodeCatalyst GA release in April 2023."
        image: assets/img/timeline/3.jpg
        icon: fas fa-users-cog
        alt:
        align: left
      - title: "Senior Technical Writer"
        company: "Amazon Web Services"
        year: "October 2021 - May 2022"
        desc: "Established documentation patterns and content architecture for CodeCatalyst prior to December 2022 public preview, creating foundational standards for new integrated DevOps service."
        image: assets/img/timeline/4.jpg
        icon: fas fa-file-alt
        alt:
        align: left
      - title: "Technical Writer"
        company: "Amazon Web Services"
        year: "November 2019 - September 2021"
        desc: "Developed and maintained technical documentation for Developer Tools (CodeArtifact and CodeDeploy), including 50+ API operations and 700 user guide topics."
        image: assets/img/timeline/4.jpg
        icon: fas fa-file-code
        alt:
        align: left
      - title: "Program Manager II & Content Developer II"
        company: "Microsoft"
        year: "2016-2019"
        desc: "Managed product development backlog for 15+ developers, conducted customer outreach, and maintained 100+ articles for Azure DevOps. Created SEO plans and delivered monthly content performance reports to leadership."
        image: assets/img/timeline/3.jpg
        icon: fas fa-tasks
        alt:
        align: left
      - title: "Software Engineer"
        company: "IBM"
        year: "2014-2016"
        desc: "Designed and developed unit tests for WebSphere Application Server's intelligent management and dynamic routing functionality. Worked with Eclipse RTC and Git in an agile environment."
        image: assets/img/timeline/4.jpg
        icon: fas fa-code
        alt:
        align: left
      - title: "Bachelor of Science in Computer Science"
        company: "University of North Carolina at Chapel Hill"
        year: "2014"
        desc: "Graduated with a strong foundation in computer science, algorithms, and software engineering."
        image: assets/img/timeline/4.jpg
        icon: fas fa-graduation-cap
        alt:
        align: left

  # About section moved to header - removed

  # Team, clients, and contact sections removed

  footer:
    legal: "Privacy Policy"
    social: []
