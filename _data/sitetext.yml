en: &DEFAULT_EN
  header:
    title: Hi, I'm Elijah Batkoski
    text: I'm an experienced technical writer, product manager, and customer advocate with over 10 years in the tech industry. Currently working as a Senior UX Writer at AWS, I specialize in creating clear, user-focused documentation and advocating for customer experience in product design. My background spans from software engineering at IBM to technical writing and product management at Microsoft and AWS. I'm passionate about technology, gaming, DevOps, and making data-driven decisions that improve products for every user.
    button: View My Work
    buttonlink: "#portfolio"
    image: assets/img/team/500x500.jpg
    social:
      - url: https://linkedin.com/in/elijah-batkoski-54255559
        icon: fab fa-linkedin-in
      - url: mailto:ebatkoski@gmail.com
        icon: fas fa-envelope

  services:
    title: "Skills"
    text: "What I bring to the table"
    section: services
    list:
      - title: "Technical Writing"
        desc: "Expert in creating and maintaining comprehensive technical documentation, API references, and user guides for complex software products."
        icon: fas fa-file-alt
      - title: "Product Management"
        desc: "Experienced in prioritizing backlogs, conducting customer outreach, and creating feature specifications with data-driven decision making."
        icon: fas fa-tasks
      - title: "Customer Advocacy"
        desc: "Strong advocate for customer experience during product design, UX reviews, and feature development with focus on usability."
        icon: fas fa-users

  portfolio:
    title: "Projects"
    text: "Check out some of my recent work"
    section: portfolio
    closebutton: "Close Project"

  timeline:
    title: "Experience"
    text: "My professional journey"
    section: timeline
    start_align: "left"
    events:
      - title: "Senior UX Writer"
        year: "July 2025 - Present"
        desc: "Amazon Web Services - Leading UX writing initiatives for AWS Developer Tools, focusing on creating intuitive and user-friendly content experiences."
        image: assets/img/timeline/1.jpg
        icon: fas fa-pen-fancy
        alt:
        align: left
      - title: "Senior Technical Writer & Documentation Manager"
        year: "2021-2025"
        desc: "Amazon Web Services - Developed and maintained technical documentation for AWS Developer Tools (CodeArtifact and CodeDeploy), including 50+ API operations and 700+ user guide topics. Advocated for customers during product design discussions and UX reviews."
        image: assets/img/timeline/2.jpg
        icon: fas fa-file-alt
        alt:
        align: left
      - title: "Program Manager II & Content Developer II"
        year: "2016-2019"
        desc: "Microsoft - Managed product development backlog for 15+ developers, conducted customer outreach, and maintained 100+ articles for Azure DevOps. Created SEO plans and delivered monthly content performance reports to leadership."
        image: assets/img/timeline/3.jpg
        icon: fas fa-tasks
        alt:
        align: left
      - title: "Software Engineer"
        year: "2014-2016"
        desc: "IBM - Designed and developed unit tests for WebSphere Application Server. Worked in an agile environment with Eclipse RTC and Git, and delivered support presentations to users."
        image: assets/img/timeline/4.jpg
        icon: fas fa-code
        alt:
        align: left
      - title: "Bachelor of Science in Computer Science"
        year: "2014"
        desc: "University of North Carolina at Chapel Hill - Graduated with a strong foundation in computer science, algorithms, and software engineering."
        image: assets/img/timeline/4.jpg
        icon: fas fa-graduation-cap
        alt:
        align: left
    end: "Let's Build <br> Something <br> Together!"

  # About section moved to header - removed

  # Team, clients, and contact sections removed

  footer:
    legal: "Privacy Policy"
    social: []
